services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: mvp
      POSTGRES_PASSWORD: mvp_local_only
      POSTGRES_DB: personalisation
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mvp -d personalisation"]
      interval: 2s
      retries: 20
volumes:
  postgres_data:
