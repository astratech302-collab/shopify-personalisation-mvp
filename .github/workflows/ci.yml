name: local-foundations
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: mvp
          POSTGRES_PASSWORD: mvp_local_only
          POSTGRES_DB: personalisation
        ports: ['55432:5432']
        options: --health-cmd "pg_isready -U mvp -d personalisation" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: cp .env.example .env
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm db:migrate && pnpm db:seed && pnpm test:db && pnpm test:constraints && pnpm test:jobs && pnpm test:ingestion && pnpm test:workspaces
      - run: pnpm build
      - run: pnpm test:lifecycle
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
# Shopify's authenticated platform build and live gates are separate, not simulated here.
